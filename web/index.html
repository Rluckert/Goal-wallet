<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Savings Goal — Detail</title>
    <style>
      /*
       * Davivienda brand color palette. Source of truth:
       * .claude/skills/davivienda-color-palette/reference/colors.ts
       * (light: colors.light, dark: colors.dark) — do not change these
       * hex values without the user's explicit instruction.
       */
      :root {
        color-scheme: light dark;
        --bg: #ffffff; /* background */
        --fg: #1a1a1a; /* text */
        --muted: #737373; /* textSecondary */
        --accent: #e1251b; /* primary */
        --border: #e5e5e5; /* border */
        --error: #c81e1e; /* error */
        --track: #e5e5e5; /* border */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212; /* background */
          --fg: #ffffff; /* text */
          --muted: #b8b8b8; /* textSecondary */
          --accent: #f0443b; /* primary */
          --border: #383838; /* border */
          --error: #ef4444; /* error */
          --track: #383838; /* border */
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      #status {
        color: var(--muted);
        font-size: 14px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
      }
      .amounts {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .track {
        height: 10px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.2s ease;
      }
      .progress-label {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      form {
        margin-top: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 16px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 16px;
        font-weight: 600;
      }
      #form-error {
        color: var(--error);
        font-size: 13px;
        margin-top: 8px;
        min-height: 16px;
      }
      #confirmation {
        color: var(--accent);
        font-size: 13px;
        margin-top: 8px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1 id="goal-name">Savings Goal</h1>
    <div id="status">Waiting for session…</div>

    <div class="card" id="progress-card" hidden>
      <div class="amounts">
        <span id="saved-amount">$0</span>
        <span id="target-amount">of $0</span>
      </div>
      <div class="track">
        <div class="fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-label" id="progress-label">0% complete</div>
    </div>

    <form id="deposit-form" hidden>
      <label for="amount-input">Deposit amount</label>
      <input id="amount-input" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" />
      <div id="form-error" role="alert"></div>
      <button type="submit">Deposit</button>
      <div id="confirmation" role="status"></div>
    </form>

    <script src="dist/bundle.js"></script>
  </body>
</html>
